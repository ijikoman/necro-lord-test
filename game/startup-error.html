<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120c18">
  <title>NECRO LORD - 起動の確認</title>
  <style>
    body { margin:0; background:#120c18; color:#f6edf9; font-family:system-ui,sans-serif; line-height:1.8; }
    main { max-width:440px; padding:40px 24px; margin:auto; }
    h1 { color:#edcf95; font-size:25px; }
    h2 { font-size:21px; }
    p, li { font-size:16px; }
    a { box-sizing:border-box; display:block; width:100%; margin:18px 0; padding:12px 16px; border:1px solid #edcf95; border-radius:10px; color:#edcf95; text-align:center; text-decoration:none; }
    #retry { background:#edcf95; color:#24142e; font-weight:700; }
    details { margin-top:24px; border-top:1px solid #513e61; padding-top:16px; }
    summary { cursor:pointer; color:#d8c5e4; }
    small { color:#c9b7d5; }
  </style>
</head>
<body>
<main>
  <h1>NECRO LORD</h1>
  <h2 id="heading">ゲームを読み込めませんでした</h2>
  <p id="reason">一時的に読み込みに失敗しました。まずゲームを再読み込みしてください。</p>
  <a id="retry" href="./">ゲームを再読み込み</a>
  <details>
    <summary>何度も表示される場合の対処</summary>
    <p>ChromeまたはAndroid System WebViewが古い場合に限り、更新後にアプリを開き直してください。このゲームにはChrome・WebView 101以上が必要です。</p>
    <a href="https://play.google.com/store/apps/details?id=com.android.chrome">Google PlayでChromeを開く</a>
    <a href="https://play.google.com/store/apps/details?id=com.google.android.webview">Android System WebViewを開く</a>
  </details>
  <small>開発者には診断用データを送信する場合があります。</small>
</main>
<!-- Keep this page independent of modules, Capacitor APIs, and modern syntax:
     it must remain readable on the unsupported WebView itself. -->
<script>
  var match = navigator.userAgent.match(/(?:Chrome|Chromium)\/(\d+)/);
  if (match && Number(match[1]) < 101) {
    document.getElementById('heading').textContent = 'Chromeの更新が必要です';
    document.getElementById('reason').textContent = '端末のChrome・WebViewが古いため、ゲームを開けません（現在のバージョン: ' + match[1] + '）。下のボタンから更新してください。';
  }
  document.getElementById('retry').addEventListener('click', function () {
    this.textContent = '再読み込み中…';
  });
</script>
</body>
</html>
